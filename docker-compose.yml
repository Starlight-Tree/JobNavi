# jobnavi のローカル開発用（Postgres 17 + FastAPI + Next.js）。
#   docker compose up -d --build    # 起動（マイグレーションもダミーデータも流さない）
#   初めての環境は、先に README の「Quick start」の手順（db → migrate → seed → seed-images）を実行する
#   http://localhost:3200            # 画面（求人検索）
#   http://localhost:8200/docs       # API の仕様（FastAPI の自動文書）
# 他のローカルのサービスと同時に動かせるよう、ポートは 3200 / 8200 にしてある。
name: jobnavi

services:
  # 求人のデータ。ホストにポートを公開せず、internal の backend-net（外へも出られない）にだけ置く。
  # 空のボリュームで初めて起動したときだけ、db/ の SQL（テーブルとマスタ）を流し込む。
  db:
    image: postgres:17
    container_name: jobnavi-db
    # 表示用ラベル
    labels:
      local.ui.group: "App-JobNavi"
    environment:
      POSTGRES_DB: jobnavi
      POSTGRES_USER: jobnavi
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:-jobnavi-local}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_codes.sql:/docker-entrypoint-initdb.d/02-seed-codes.sql:ro
    networks:
      - backend-net
    healthcheck:
      # -h 127.0.0.1: 初回の初期化中の一時サーバー（ソケットだけ待ち受ける）を、起動済みと見なさないため
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobnavi -d jobnavi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- 次の 3 つは「道具」（profile: tools）。docker compose up では起動しない。必要なときに docker compose run --rm <名前> で 1 回だけ実行する ---
  # 通常の起動（up）はマイグレーションもダミーデータも流さない。本番では migrate だけを、デプロイの作業として明示的に実行する。

  # マイグレーション。既存の DB には、データを変えずに足りないものだけ足す。--status / --dry-run は README の「開発とテスト」の「既存の DB のマイグレーション」
  migrate:
    build: ./backend
    container_name: jobnavi-migrate
    profiles: ["tools"]
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: &database_url "postgresql://jobnavi:${LOCAL_DB_PASSWORD:-jobnavi-local}@db:5432/jobnavi"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # ダミーの求人・アカウントを入れる（開発・テスト専用。すでにデータがあれば何もせず、既存の求人に demo_key を結ぶだけ。入れ直すときは README の「起動」の `--reset`）
  seed:
    build: ./backend
    container_name: jobnavi-seed
    # 表示用ラベル
    labels:
      local.ui.group: "App-JobNavi"
    profiles: ["tools"]
    command: ["python", "-m", "app.seed_demo"]
    environment:
      DEMO_DATA: allow   # この値が無いと、seed_demo は実行を拒否する（本番の DB に誤って入れないため）
      DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # ダミーの画像を登録・承認する（開発・テスト専用。何度実行しても増えない）。元ファイルが無い環境でも、api と画面は起動する
  seed-images:
    build: ./backend
    container_name: jobnavi-seed-images
    profiles: ["tools"]
    command: ["python", "-m", "app.seed_images", "--source-dir", "/demo-images"]
    environment:
      DEMO_DATA: allow
      # 画像の保存。ここは開発用のフォルダー（名前付きボリューム dev-media。消してよい）。本番は s3（Cloudflare R2）にする。docs/image-storage.md
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/media
      IMAGE_PUBLIC_BASE_URL: /media
      DATABASE_URL: *database_url
    volumes:
      - dev-media:/data/media
      # ダミーの画像の元ファイル（読み取り専用）。画像の置き場を移したら、--source-url（README）に切り替える
      - ./frontend/public/images/generated/recruits:/demo-images:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # 検索エンジン（任意。profile: search）。Postgres が正で、これは写し（索引）。api に SEARCH_ENGINE=meilisearch を渡したときだけ使う（既定は使わない）。
  # 起動: `docker compose --profile search up -d meilisearch`、索引づくり: `docker compose run --rm search-index`。docs/development.md の「検索エンジン（任意）」
  # backend-net（internal）にだけ置く。ホストには公開しない。MEILI_MASTER_KEY の既定は開発用の値（秘密ではない）。本番は別の値を Infisical などで渡す
  meilisearch:
    image: getmeili/meilisearch:v1.57.0
    container_name: jobnavi-meilisearch
    labels:
      local.ui.group: "App-JobNavi"
    profiles: ["search"]
    environment:
      MEILI_ENV: production   # 開発用のダッシュボードを無効にし、マスターキーを必須にする
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-jobnavi-local-meili-key}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 検索エンジンの索引を、DB から作り直す（何度流しても同じ。求人を足す・変えたあと、seed のあとに流す）。meilisearch が起動していること
  search-index:
    build: ./backend
    container_name: jobnavi-search-index
    labels:
      local.ui.group: "App-JobNavi"
    profiles: ["tools"]
    command: ["python", "-m", "app.search_index"]
    environment:
      DATABASE_URL: *database_url
      MEILI_URL: "http://meilisearch:7700"
      MEILI_API_KEY: "${MEILI_MASTER_KEY:-jobnavi-local-meili-key}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  api:
    build: ./backend
    container_name: jobnavi-api
    # 表示用ラベル
    labels:
      local.ui.group: "App-JobNavi"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/code/app"]
    environment:
      # 画像の保存。既定は開発用のフォルダー（名前付きボリューム dev-media。消してよい）。R2（s3）へ切り替えるときだけ、.env（Git 管理外）に値を書く。docs/image-storage.md
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      STORAGE_LOCAL_DIR: /data/media
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-/media}"
      STORAGE_S3_ENDPOINT_URL: "${STORAGE_S3_ENDPOINT_URL:-}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
      STORAGE_S3_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY_ID:-}"
      STORAGE_S3_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_ACCESS_KEY:-}"
      DATABASE_URL: *database_url
      CORS_ORIGINS: "http://localhost:3200"
      # 求職者のログイン。画面のサーバー（frontend の Better Auth）が出す JWT を、その JWKS の公開鍵で検証するだけ（ログインの通信・シークレットは持たない）。
      # AUTH_BASE_URL は frontend の BETTER_AUTH_URL と同じ値（JWT の iss）。AUTH_JWKS_URL は、API のコンテナから届く frontend の URL
      AUTH_BASE_URL: "${BETTER_AUTH_URL:-http://localhost:3200}"
      AUTH_JWKS_URL: "http://frontend:3000/api/auth/jwks"
      AUTH_AUDIENCE: "jobnavi"
      # ホスト↔コンテナ間のボリュームでファイル変更通知が届かない環境（Docker Desktop 等）向け
      WATCHFILES_FORCE_POLLING: "true"
      # 検索エンジン（任意）。既定は Postgres の検索。meilisearch にすると、キーワード（q）の候補を Meilisearch から引く（届かない・結果が多すぎるときは Postgres に戻る）
      SEARCH_ENGINE: "${SEARCH_ENGINE:-postgres}"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_API_KEY: "${MEILI_MASTER_KEY:-jobnavi-local-meili-key}"
    volumes:
      - ./backend/app:/code/app
      - dev-media:/data/media
    ports:
      - "127.0.0.1:8200:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 画面の開発サーバー（frontend/ の next dev）。API はサーバー側（Next.js）から呼ぶので、ブラウザーは API を直接呼ばない。
  frontend:
    image: node:24-slim
    container_name: jobnavi-frontend
    # 表示用ラベル
    labels:
      local.ui.group: "App-JobNavi"
    working_dir: /app
    environment:
      API_BASE_URL: "http://api:8000"
      # 公開画像の URL の頭。既定は /media（API が配る）。R2 に切り替えるときは .env で api と同じ値にする（next.config.ts が読む）
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-/media}"
      # 求職者のログイン（Better Auth。Google だけ）。画面のサーバーの中で動く（frontend/src/lib/auth.ts）。Google の OAuth クライアントは、あなたが Google Cloud Console で作る（README）。
      # 値は Infisical（scripts/login-secrets.sh で登録し、`infisical run --projectId <ID> --env dev -- docker compose up -d` で起動する）か、.env（Git 管理外）に書く。足りないときは、ログイン画面に「まだ設定されていません」と出る（他の画面は動く）
      # BETTER_AUTH_SECRET は 32 文字以上のランダムな値（例: openssl rand -base64 32）。一度決めたら変えない（DB の auth_jwks の署名鍵と、Google のトークンの暗号化に使う。変えると全員がログアウトに見える）
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3200}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # ログイン（Better Auth）の表（auth_ で始まる表）を読み書きするための DB 接続。注意: api・migrate と同じ資格情報で、表ごとの権限分けはしていない（auth_ の表だけを使うのは、コードの上の約束）。求人など、アプリのデータは、これまでどおり API 経由で読む
      DATABASE_URL: *database_url
    volumes:
      - ./frontend:/app
      # node_modules と .next は、ホストのものと分ける（ネイティブの依存が OS ごとに違うため）
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    # 依存は npm ci で入れる（package-lock.json のとおりに入れ、ロックは書き換えない。ホストの frontend/ を共有しているので、npm install だとホストのロックが変わりうる）。
    # ただし毎回は入れ直さない（npm ci は node_modules の中身を空にして、入れ直す。再起動のたびに、ダウンロードと時間がかかる。restart: unless-stopped なので、落ち続けるとそれを繰り返す）。
    # package.json と package-lock.json の組の sha256 を node_modules/.deps-sha256 に残し、前に入れたときと同じなら飛ばす。
    # 変わったとき・初めて・前回が途中で止まったとき（印が無い）だけ入れる。依存を足したら、ホストで更新して `docker compose restart frontend`。
    # package.json とロックが食い違うと、npm ci が止まって起動しない（ログに出る）。
    command:
      - sh
      - -c
      - |
        set -e
        stamp=node_modules/.deps-sha256
        want="$$(cat package.json package-lock.json | sha256sum | cut -d' ' -f1)"
        if [ "$$(cat "$$stamp" 2>/dev/null || true)" != "$$want" ]; then
          npm ci --no-audit --no-fund
          echo "$$want" > "$$stamp"
        fi
        npm run dev -- --hostname 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

# frontend-net: frontend と api（frontend は npm ci と Google への通信で外へ出る）。
# backend-net: db・meilisearch（profile: search）と、api・frontend・道具（migrate・seed・seed-images・search-index）。internal なので、db は外へ出られず、ホストからも届かない。
#   frontend が backend-net にいるのは、ログイン（Better Auth の auth_ の表）のため。2026-11-20 に、Next.js の公式の構成（認証を画面のサーバーの中に置く）を選んで、DB へ届くようにした。
networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  pg-data:
  dev-media:   # 開発用の画像の保存先（API と seed-images が共有）。docker compose down -v で消える
  meili-data:  # 検索エンジンの索引（写し。DB から作り直せる）。docker compose down -v で消える
  frontend_node_modules:
  frontend_next_cache:
