name: CI

# テストとビルドだけを行う。デプロイは含まない。外部の API（Gemini・Cloudflare R2 など）は呼ばない。
# アクションは、改ざんされたタグを掴まないよう、コミット SHA で固定している（コメントは対応するタグ）。
# Go の版は backend/go.mod、Python（ワークフローの検査用）と Node の版は、.python-version と .node-version から読む（scripts/check-versions.sh が各ファイルとの整合を確かめる）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Actions 画面や gh workflow run から、任意のブランチで手動実行する

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Go, Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DB を使うテスト（ほぼ全部）のための、使い捨ての Postgres。README と同じ 17。
    # テスト専用のダミーの認証情報で、秘密情報は入っていない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # backend/testutil_test.go は、この URL で接続して、テスト用の DB（jobnavi_go_*）を作る。無いと DB のテストはスキップされる。
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # TestBackupAndRestoreRoundtrip は /usr/lib/postgresql/17/bin の pg_dump / pg_restore を使う。
      # ランナーには 17 のクライアントが無く、無いとそのテストが飛ばされる。サービスの Postgres と同じ 17 を入れる。
      # 公式の設定スクリプトがあればそれを使い、無ければ PGDG の apt リポジトリを手で足す。
      - name: Install the Postgres 17 client
        working-directory: .
        run: |
          set -eu
          if [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          else
            . /etc/os-release
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y postgresql-client-17
          # テストが決め打ちしている場所に来ているか確かめる（無ければここで落とす）
          for tool in pg_dump pg_restore; do
            test -x "/usr/lib/postgresql/17/bin/${tool}"
          done
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt で整えていないファイル:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # -tags nodynamic: WebP は、共有ライブラリを探さず、組み込みの libwebp だけを使う（本番のイメージと同じ）
      - name: go vet
        run: go vet -tags nodynamic ./...
      # 画像は、テスト用に作ったファイルと、偽の S3・偽の Meilisearch で確かめる。外部のサービスは呼ばない。
      - name: Run go test
        run: |
          set -o pipefail
          go test -tags nodynamic -race -count=1 -v ./... | tee gotest.log
      # TEST_DATABASE_URL の綴りがずれたり、pg_dump が無かったりすると、テストはスキップされたまま green になる。スキップが 1 件でもあれば落とす。
      - name: No test may be skipped
        run: |
          if grep -qE '^[[:space:]]*--- SKIP' gotest.log; then
            echo "スキップされたテストがある。gotest.log の SKIP の行で理由を確かめる（DB の設定、pg_dump の有無など）" >&2
            grep -E '^[[:space:]]*--- SKIP' gotest.log >&2
            exit 1
          fi

  backend-image:
    name: Backend image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          push: false
          load: true
          tags: jobnavi-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # DB が無いと API は起動しない（接続プールを開くため）ので、起動はしない。イメージの中のバイナリが動くこと（設定が無いと、固定の文で止まる）だけ確かめる。
      - name: Run the binary inside the image
        run: |
          set +e
          out="$(docker run --rm jobnavi-api:ci migrate 2>&1)"
          code=$?
          echo "$out"
          [ "$code" -eq 1 ] && grep -q 'DATABASE_URL が未設定です' <<<"$out"
      # ルートの docker-compose.yml の構文と、環境変数の既定値を確かめる（起動はしない。.env は不要）
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  frontend:
    name: Frontend (Next.js) tests, build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      # typecheck は build の後（.next/types を使う）
      - name: Type-check
        run: npm run typecheck

  workflow-lint:
    name: Workflow lint and version check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lint.txt
      # Python と Node の版が、Dockerfile・Compose・engines・CLAUDE.md・この CI で揃っているか
      - name: Python and Node versions agree
        run: scripts/check-versions.sh
      # ツールは、ハッシュ付きの固定（requirements-lint.txt）から入れる。アプリの依存とは別
      - name: Install the linters
        run: pip install --require-hashes -r requirements-lint.txt
      # 式の誤り・存在しないキー・run の中のシェルの問題など、構文と型の検査
      - name: actionlint
        run: actionlint
      # セキュリティの検査（権限・テンプレート注入・SHA 固定の偽装など）。GH_TOKEN は、固定した SHA が
      # 本物のリポジトリの履歴にあるか、既知の脆弱なアクションでないかを、GitHub に問い合わせるためだけに使う
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
